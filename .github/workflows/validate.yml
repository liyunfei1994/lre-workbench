name: Validate workbench
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
      LRE_NO_PAUSE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-science.txt
            constraints.txt
      - name: Install using the same bootstrap as the desktop
        run: python scripts/bootstrap.py --setup
      - name: Check dependency consistency
        run: .\.venv\Scripts\python.exe -m pip check
      - name: Verify Windows installer and shortcut
        run: |
          cmd /c setup_windows.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m unittest discover -s tests -p test_windows_taskbar.py -k test_shortcut_properties_recognized_by_windows_shell -v
      - name: Run regression tests
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v
      - name: Capture environment
        if: always()
        run: .\.venv\Scripts\python.exe scripts/bootstrap.py --diagnose
      - name: Build clean source package
        run: .\.venv\Scripts\python.exe scripts/build_release.py
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: workbench-source-py${{ matrix.python }}
          path: |
            release/*-team-source.zip
            release/*-team-source.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: environment-py${{ matrix.python }}
          path: diagnostics/*.json
          if-no-files-found: ignore
